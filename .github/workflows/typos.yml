name: Typos

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "docs/**"
      - ".github/workflows/typos.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "docs/**"
      - ".github/workflows/typos.yml"

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: crate-ci/typos@631208b7aac2daa8b707f55e7331f9112b0e062d # v1.44.0
