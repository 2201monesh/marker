name: Typos

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "docs/**"
      - ".github/workflows/typos.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "docs/**"
      - ".github/workflows/typos.yml"

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
