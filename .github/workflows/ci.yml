name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-dist
          path: dist
          if-no-files-found: error

  forms_smoke_test:
    name: Forms Smoke Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-dist
          path: dist
      - run: npx playwright install chromium --with-deps
      - run: npm run test:forms-smoke

  accessibility:
    name: Accessibility
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-dist
          path: dist
      - run: npx playwright install chromium --with-deps
      - run: npm run test:a11y

  not_found_smoke_test:
    name: Not Found Smoke Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-dist
          path: dist
      - run: npx playwright install chromium --with-deps
      - run: npm run test:not-found-smoke

  deploy_preview:
    name: Deploy Preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - build
      - forms_smoke_test
      - accessibility
      - not_found_smoke_test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-dist
          path: dist
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONMARKER_SITE }}
      - id: firebase_preview
        run: |
          npx firebase-tools@15.10.0 hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" --project onmarker-site --expires 7d --json > deploy-result.json
          cat deploy-result.json

          preview_url="$(jq -r '.. | .url? // empty' deploy-result.json | head -n 1)"
          if [ -n "$preview_url" ]; then
            echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
            echo "Preview URL: $preview_url" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Comment preview URL on PR
        if: steps.firebase_preview.outputs.preview_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.firebase_preview.outputs.preview_url }}
        run: |
          comment_body="🔗 **Preview:** $PREVIEW_URL"
          # Look for an existing preview comment to update
          existing_comment_id=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.body | startswith("🔗 **Preview:**")) | .id' | head -n 1)
          if [ -n "$existing_comment_id" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${existing_comment_id}" -X PATCH -f body="$comment_body"
          else
            gh pr comment "$PR_NUMBER" --body "$comment_body"
          fi
